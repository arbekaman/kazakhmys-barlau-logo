:root{
  --navy:#050d1b; --navy2:#0a1d38;
  --blue:#3860a9; --cyan:#0cb5dd; --gold:#ffc731;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--navy);transition:background-color .8s}
html.light,html.light body{background:#eef3f9}
body{cursor:none;font-family:"KB Text",Inter,"Segoe UI",Arial,sans-serif;color:#fff}
body.show-cursor{cursor:default}

#bg{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.sky,.vig{position:fixed;inset:0;pointer-events:none;transition:opacity .8s ease}
#skyD{background:radial-gradient(ellipse 80% 70% at 50% 42%, #0d2748 0%, #081830 45%, var(--navy) 100%)}
#skyL{background:radial-gradient(ellipse 80% 70% at 50% 42%, #ffffff 0%, #f3f7fb 45%, #e2ebf5 100%);opacity:0}
#vigD{background:radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgba(2,6,14,.75) 100%)}
#vigL{background:radial-gradient(ellipse 75% 70% at 50% 45%, transparent 55%, rgba(120,150,190,.22) 100%);opacity:0}
html.light #skyL,html.light #vigL{opacity:1} html.light #skyD,html.light #vigD{opacity:0}

#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}

/* ---------- LOGO (статично, сразу сверху) ---------- */
#logo{position:absolute;left:15px;top:73px;width:1907px;height:989px;transform-origin:945px 467px;
  transform:scale(.56)}
#logo svg{position:absolute;inset:0;width:1907px;height:989px;overflow:visible}
#logo img{position:absolute;display:block;user-select:none}
.glow{position:absolute;left:420px;top:40px;width:1100px;height:700px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(12,181,221,.30), rgba(56,96,169,.12) 55%, transparent 100%);
  filter:blur(30px);opacity:.55;transition:background .8s;animation:breathe 6s ease-in-out infinite;will-change:opacity}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:.8}}
html.light .glow{background:radial-gradient(closest-side, rgba(12,181,221,.16), rgba(56,96,169,.06) 55%, transparent 100%)}

/* блик по контуру логотипа: старт в левом нижнем углу, вверх по часовой */
.outline{opacity:.14}
.comet{filter:drop-shadow(0 0 7px #0cb5dd) drop-shadow(0 0 14px rgba(12,181,221,.6));
  animation:phosphor 3.2s ease-in-out infinite}
.afterglow{filter:blur(3px) drop-shadow(0 0 14px rgba(12,181,221,.55))}
@keyframes phosphor{0%,100%{opacity:1}50%{opacity:.86}}
html.light .outline{opacity:.18;stroke:#3860a9}
html.light .comet{filter:drop-shadow(0 0 5px rgba(12,181,221,.9)) drop-shadow(0 0 14px rgba(12,160,221,.55))}
html.light .afterglow{filter:blur(3px) drop-shadow(0 0 12px rgba(12,181,221,.45))}
html.light .tail{stroke:#0aa6d8}


/* буквы: появление + волна свечения */
#logo img.k,#logo img.bl{opacity:0;will-change:transform,opacity,filter}
.play #logo img.k{animation:letterIn 1s cubic-bezier(.16,1,.3,1) calc(.3s + var(--i)*80ms) both, waveK 8s ease-in-out calc(3s + var(--i)*90ms) infinite}
.play #logo img.bl{animation:letterIn 1.2s cubic-bezier(.16,1,.3,1) calc(.9s + var(--i)*120ms) both, waveB 8s ease-in-out calc(3.9s + var(--i)*140ms) infinite}
@keyframes letterIn{from{opacity:0;transform:translateY(30px);filter:var(--ink) blur(12px)}to{opacity:var(--o);transform:none;filter:var(--ink) blur(0)}}
@keyframes waveK{0%,16%,100%{opacity:var(--o);transform:none;filter:var(--ink)}
  7%{opacity:1;transform:translateY(-7px);filter:var(--ink) var(--kGlow)}}
@keyframes waveB{0%,16%,100%{opacity:1;transform:none;filter:var(--ink)}
  7%{opacity:1;transform:translateY(-10px);filter:var(--ink) var(--bGlow)}}
/* тёмная тема: буквы белые; светлая: обе строки тёмно-синие, как BARLAU */
#logo{--ink:brightness(1);
  --kGlow:brightness(1.4) drop-shadow(0 0 10px rgba(127,211,238,.9));
  --bGlow:brightness(1.25) drop-shadow(0 0 14px rgba(255,199,49,.75))}
html.light #logo{--ink:url(#inkNavy);
  --kGlow:brightness(1.9) drop-shadow(0 0 10px rgba(12,181,221,.7));
  --bGlow:brightness(1.9) drop-shadow(0 0 14px rgba(255,190,40,.8))}
#logo img.k{--o:.92} #logo img.bl{--o:1} html.light #logo img.k{--o:1}
#logo img.k,#logo img.bl{filter:var(--ink)}



/* ---------- STRATA ---------- */
#strata{position:absolute;left:0;bottom:0;width:1920px;height:120px;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
#strata svg{position:absolute;left:0;top:0;width:3840px;height:120px;will-change:transform;backface-visibility:hidden;
  transform:translate3d(0,0,0);animation:drift 140s linear infinite}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-1920px,0,0)}}

#hint{position:fixed;right:18px;bottom:14px;font:500 13px/1.4 Inter,Arial,sans-serif;color:rgba(255,255,255,.55);
  background:rgba(0,0,0,.35);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .4s;pointer-events:none}
body.show-cursor #hint{opacity:1}

<div id="hint">F / двойной клик — полный экран &nbsp;·&nbsp; R / пробел — перезапуск</div>

<script>

const stage = document.getElementById('stage');
const bg = document.getElementById('bg');
const ctx = bg.getContext('2d', { alpha: true, desynchronized: true });
let W, H, DPR, S, OX, OY;

/* ---------- noise ---------- */
const P = new Uint8Array(512);
(function(){ const p=[...Array(256).keys()]; let s=1337;
  for(let i=255;i>0;i--){ s=(s*16807)%2147483647; const j=s%(i+1); [p[i],p[j]]=[p[j],p[i]]; }
  for(let i=0;i<512;i++) P[i]=p[i&255]; })();
function grad(h,x,y,z){h&=15;const u=h<8?x:y, v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v);}
function noise(x,y,z){
  const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z);
  const X=fx&255,Y=fy&255,Z=fz&255; x-=fx;y-=fy;z-=fz;
  const u=x*x*x*(x*(x*6-15)+10), v=y*y*y*(y*(y*6-15)+10), w=z*z*z*(z*(z*6-15)+10);
  const A=P[X]+Y,AA=P[A]+Z,AB=P[A+1]+Z,B=P[X+1]+Y,BA=P[B]+Z,BB=P[B+1]+Z;
  const l1=grad(P[AA],x,y,z),   l2=grad(P[BA],x-1,y,z),   l3=grad(P[AB],x,y-1,z),   l4=grad(P[BB],x-1,y-1,z);
  const l5=grad(P[AA+1],x,y,z-1),l6=grad(P[BA+1],x-1,y,z-1),l7=grad(P[AB+1],x,y-1,z-1),l8=grad(P[BB+1],x-1,y-1,z-1);
  const a=l1+u*(l2-l1), b=l3+u*(l4-l3), c=l5+u*(l6-l5), d=l7+u*(l8-l7);
  const e=a+v*(b-a), f=c+v*(d-c);
  return e+w*(f-e);
}

/* ---------- topographic contours: каждый кадр, без аллокаций ---------- */
const CELL = 16;               // шаг сетки, CSS px
const LEVELS = 16;
let field, gw = 0, gh = 0;
function layout(){
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  S = Math.min(W/1920, H/1080); OX = (W - 1920*S)/2; OY = (H - 1080*S)/2;
  stage.style.transform = `translate(${OX}px,${OY}px) scale(${S})`;
  bg.width = Math.round(W*DPR); bg.height = Math.round(H*DPR);
  gw = Math.ceil(W/CELL)+1; gh = Math.ceil(H/CELL)+1; field = new Float32Array(gw*gh); allocTrace();
}
addEventListener('resize', layout);

function computeField(z){
  const k1 = 0.0016/S, k2 = 0.0034/S, z2 = z*1.4;
  for (let j=0;j<gh;j++){
    const y=j*CELL, row=j*gw;
    for (let i=0;i<gw;i++){
      const x=i*CELL;
      field[row+i] = noise(x*k1, y*k1, z) + 0.45*noise(x*k2+7.1, y*k2+3.3, z2);
    }
  }
}
/* сегменты marching squares сшиваются в непрерывные линии и рисуются кривыми */
let NE, edgeX, edgeY, edgeS0, edgeS1, edgeStamp, segE0, segE1, segVis, ptX, ptY, stamp = 0;
function allocTrace(){
  NE = 2*gw*gh; const NS = 2*gw*gh;
  edgeX = new Float32Array(NE); edgeY = new Float32Array(NE);
  edgeS0 = new Int32Array(NE); edgeS1 = new Int32Array(NE); edgeStamp = new Int32Array(NE);
  segE0 = new Int32Array(NS); segE1 = new Int32Array(NS); segVis = new Uint8Array(NS);
  ptX = new Float32Array(NS+2); ptY = new Float32Array(NS+2);
}
let nSeg = 0;
function addSeg(e0, e1){
  const k = nSeg++; segE0[k]=e0; segE1[k]=e1; segVis[k]=0;
  for (const e of [e0,e1]){
    if (edgeStamp[e]!==stamp){ edgeStamp[e]=stamp; edgeS0[e]=k; edgeS1[e]=-1; } else edgeS1[e]=k;
  }
}
function otherSeg(e, k){ if (edgeStamp[e]!==stamp) return -1; const a=edgeS0[e]; return a===k ? edgeS1[e] : a; }
function traceLevel(iso){
  const C=CELL, HV=gw*gh; stamp++; nSeg=0;
  for (let j=0;j<gh-1;j++){
    const r0=j*gw, r1=r0+gw, y=j*C;
    for (let i=0;i<gw-1;i++){
      const a=field[r0+i], b=field[r0+i+1], c=field[r1+i+1], d=field[r1+i];
      const idx=(a>iso?8:0)|(b>iso?4:0)|(c>iso?2:0)|(d>iso?1:0);
      if (idx===0||idx===15) continue;
      const x=i*C;
      const T=r0+i, B=r1+i, Lf=HV+r0+i, R=HV+r0+i+1;   // id рёбер ячейки
      edgeX[T]=x+C*(iso-a)/(b-a); edgeY[T]=y;
      edgeX[B]=x+C*(iso-d)/(c-d); edgeY[B]=y+C;
      edgeX[Lf]=x; edgeY[Lf]=y+C*(iso-a)/(d-a);
      edgeX[R]=x+C; edgeY[R]=y+C*(iso-b)/(c-b);
      switch(idx){
        case 1:case 14: addSeg(Lf,B); break;  case 2:case 13: addSeg(B,R); break;
        case 3:case 12: addSeg(Lf,R); break;  case 4:case 11: addSeg(T,R); break;
        case 5: addSeg(Lf,T); addSeg(B,R); break; case 10: addSeg(T,R); addSeg(Lf,B); break;
        case 6:case 9: addSeg(T,B); break;    case 7:case 8: addSeg(Lf,T); break;
      }
    }
  }
  for (let s0=0;s0<nSeg;s0++){
    if (segVis[s0]) continue;
    // идём назад до начала линии (или понимаем, что она замкнута)
    let st=s0, se=segE0[s0], closed=false, guard=nSeg;
    while (guard--){
      const o=otherSeg(se, st); if (o<0) break;
      if (o===s0){ closed=true; break; }
      se = segE0[o]===se ? segE1[o] : segE0[o]; st=o;
    }
    if (closed){ st=s0; se=segE0[s0]; }
    // идём вперёд, собирая точки
    let n=0, k=st, e=se;
    ptX[n]=edgeX[e]; ptY[n]=edgeY[e]; n++;
    while (true){
      segVis[k]=1;
      const ne = segE0[k]===e ? segE1[k] : segE0[k];
      ptX[n]=edgeX[ne]; ptY[n]=edgeY[ne]; n++;
      const nx = otherSeg(ne, k);
      if (nx<0 || segVis[nx]) break;
      k=nx; e=ne;
    }
    if (closed){
      n--;                                  // последняя точка = первая
      if (n<3) continue;
      ctx.moveTo((ptX[n-1]+ptX[0])/2, (ptY[n-1]+ptY[0])/2);
      for (let i=0;i<n;i++){ const q=(i+1)%n; ctx.quadraticCurveTo(ptX[i],ptY[i],(ptX[i]+ptX[q])/2,(ptY[i]+ptY[q])/2); }
    } else {
      ctx.moveTo(ptX[0],ptY[0]);
      for (let i=1;i<n-1;i++) ctx.quadraticCurveTo(ptX[i],ptY[i],(ptX[i]+ptX[i+1])/2,(ptY[i]+ptY[i+1])/2);
      ctx.lineTo(ptX[n-1],ptY[n-1]);
    }
  }
}
function drawContours(sec, alpha){
  computeField(sec*0.014);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  // все второстепенные линии — одним проходом, основные (золото) — вторым
  ctx.beginPath();
  for (let l=0;l<LEVELS;l++) if (l%4) traceLevel(-0.9 + l*(1.8/(LEVELS-1)));
  ctx.strokeStyle = mixRGBA([12,181,221,.16],[56,96,169,.16],alpha); ctx.lineWidth = Math.max(1, S*1.1); ctx.stroke();
  ctx.beginPath();
  for (let l=0;l<LEVELS;l+=4) traceLevel(-0.9 + l*(1.8/(LEVELS-1)));
  ctx.strokeStyle = mixRGBA([255,199,49,.17],[214,150,20,.26],alpha); ctx.lineWidth = 1.6*Math.max(1, S*1.1); ctx.stroke();
}

/* ---------- тема: тёмная / светлая ---------- */
let themeMix = 0, themeTarget = 0;              // 0 — тёмная, 1 — светлая (плавно)
const mixN = (a,b) => a + (b-a)*themeMix;
function mixRGB(a,b){ return `${Math.round(mixN(a[0],b[0]))},${Math.round(mixN(a[1],b[1]))},${Math.round(mixN(a[2],b[2]))}`; }
function mixRGBA(a,b,alpha){ return `rgba(${mixRGB(a,b)},${mixN(a[3],b[3])*alpha})`; }
const STRATA = {'#0a1d3a':'#dfe9f4','#091a33':'#d5e3f1','#08162c':'#cbdcee','#071326':'#c1d5ea','#061021':'#b7cee6','#7fd3ee':'#3860a9'};
const strataEls = [...document.querySelectorAll('#strata [fill]')].filter(el => STRATA[el.getAttribute('fill')])
  .map(el => ({el, d: el.getAttribute('fill')}));
function setTheme(light, save){
  document.documentElement.classList.toggle('light', light);
  themeTarget = light ? 1 : 0;
  for (const s of strataEls) s.el.setAttribute('fill', light ? STRATA[s.d] : s.d);
}
setTheme(true, false); themeMix = themeTarget;

/* ---------- пыль ---------- */
let dust = [];
function initDust(){
  dust = Array.from({length: 90}, () => ({
    x: Math.random()*1920, y: Math.random()*1080, r: .6+Math.random()*2.2,
    vy: -(6+Math.random()*18), vx: (Math.random()-.5)*6, ph: Math.random()*6.28,
    gold: Math.random()<.55
  }));
}
function drawDust(now, dt, alpha){
  ctx.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);
  ctx.globalCompositeOperation = themeMix < .5 ? 'lighter' : 'source-over';
  const cG = mixRGB([255,205,90],[214,160,40]), cB = mixRGB([120,215,245],[56,120,200]);
  for (const p of dust){
    p.y += p.vy*dt; p.x += p.vx*dt + Math.sin(now/1500+p.ph)*9*dt;
    if (p.y < -10){ p.y = 1090; p.x = Math.random()*1920; }
    const tw = .45 + .55*Math.sin(now/700 + p.ph*3);
    ctx.fillStyle = `rgba(${p.gold?cG:cB},${.38*alpha*tw})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- комета по контуру логотипа ---------- */
const BASE_SPEED = 1000/12;   // скорость внизу (как раньше): единиц контура в секунду
const TOP_END = 652.5;          // контур 0..652.5 — верх (горы), дальше — нижняя дуга
const TOP_SLOW = 0.5;           // наверху блик идёт в 2 раза медленнее
const RAMP = 45;                // плавный переход скорости
const tails = [...document.querySelectorAll('.tail')].map(el => {
  const A = +el.dataset.a, L = +el.dataset.l;        // A — отступ сегмента от головы, L — длина
  el.setAttribute('stroke-dasharray', `${L} ${1000 - L}`);
  return { el, A, L };
});
// таблица «позиция → время» с плавным изменением скорости
const smooth = x => x<=0?0:x>=1?1:x*x*(3-2*x);
const smoother = x => x<=0?0:x>=1?1:x*x*x*(x*(x*6-15)+10);
const RAMP_UP = 240;            // разгон после правого угла: плавно нарастает вдоль нижней дуги
function speedAt(p){
  const up = smoother((p - TOP_END) / RAMP_UP);                       // справа: мягкий нарастающий разгон
  const bottom = up * (1 - smooth((p - (1000 - RAMP/2)) / RAMP))
               + smooth((RAMP/2 - p) / RAMP);                          // слева: переход на подъём
  return BASE_SPEED * (TOP_SLOW + (1 - TOP_SLOW) * Math.min(1, bottom));
}
const STEPS = 2000, timeAt = new Float64Array(STEPS + 1);
for (let i = 1; i <= STEPS; i++){ const p = (i - .5) * 1000 / STEPS; timeAt[i] = timeAt[i-1] + (1000/STEPS) / speedAt(p); }
const COMET_PERIOD = timeAt[STEPS];
function headAt(t){
  t %= COMET_PERIOD;
  let lo = 0, hi = STEPS;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (timeAt[m] <= t) lo = m; else hi = m; }
  return (lo + (t - timeAt[lo]) / (timeAt[hi] - timeAt[lo])) * 1000 / STEPS;
}
function drawComet(now){
  const h = headAt((now - t0)/1000);
  for (const t of tails) t.el.setAttribute('stroke-dashoffset', (t.A + t.L - h).toFixed(2));
}

/* ---------- цикл: рендер на каждом кадре дисплея (60/120/144 Гц) ---------- */
let t0 = performance.now(), lastT = t0;
function frame(now){
  const dt = Math.min(.05, (now-lastT)/1000); lastT = now;
  themeMix += (themeTarget - themeMix) * Math.min(1, dt*4.5);
  const fadeIn = Math.min(1, (now - t0)/1800);
  drawContours(now/1000, fadeIn);
  drawDust(now, dt, fadeIn);
  drawComet(now);
  requestAnimationFrame(frame);
}
function restart(){
  document.body.classList.remove('play'); void document.body.offsetWidth; document.body.classList.add('play');
  t0 = performance.now();
}

/* ---------- управление ---------- */
function toggleFS(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}
addEventListener('keydown', e => {
  if (e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А') toggleFS();
  if (e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К'||e.code==='Space'){ e.preventDefault(); restart(); }
});
addEventListener('dblclick', toggleFS);
let hideT; addEventListener('mousemove', () => {
  document.body.classList.add('show-cursor'); clearTimeout(hideT);
  hideT = setTimeout(() => document.body.classList.remove('show-cursor'), 2500);
});

layout(); initDust();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { restart(); requestAnimationFrame(frame); });
</script>
